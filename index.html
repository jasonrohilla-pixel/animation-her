
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060208">
<title>Love Heart ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#060208;color:white}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;font-family:Arial,sans-serif}
main{width:min(100vw,800px);display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
canvas{display:block;width:min(96vw,76vh,800px);height:min(96vw,76vh,800px);max-width:800px;max-height:800px}
button{border:1px solid #a92842;border-radius:999px;color:white;background:#260813;padding:13px 25px;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 0 22px #8d123b55}
#hint{color:#d9aab6;font-size:12px;text-align:center}
</style>
</head>
<body>
<main>
<canvas id="heart" width="800" height="800"></canvas>
<button id="start">Tap to start ❤️</button>
<div id="hint">Turn your sound on for the full surprise</div>
<audio id="music" src="music.mp3" preload="auto" loop></audio>
</main>
<script>
(()=>{
const canvas=document.getElementById('heart');
const ctx=canvas.getContext('2d');
const start=document.getElementById('start');
const audio=document.getElementById('music');
const hint=document.getElementById('hint');

const SC=21,OY=20,DURATION=10000,ANIM=42,LIFT=34,GAP=7;
const SIZES=[9,10,11,12],BG='#060208';
const PHRASES=[
"I love you","Seni seviyorum","Te amo","Je t'aime",
"Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю",
"사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ",
"Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię",
"ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тебе кохаю"
];

let seed=11;
const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const choice=a=>a[Math.floor(rand()*a.length)];
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const hex=c=>'#'+c.map(v=>Math.round(Math.max(0,Math.min(1,v))*255).toString(16).padStart(2,'0')).join('');
const heart=a=>[16*Math.pow(Math.sin(a),3)*SC,(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*SC+OY];
const poly=Array.from({length:720},(_,i)=>heart(2*Math.PI*i/720));
const edges=poly.map((p,i)=>[p,poly[(i+1)%poly.length]]);
const ys=poly.map(p=>p[1]),YMAX=Math.max(...ys),YMIN=Math.min(...ys),CY=(YMAX+YMIN)/2;

function spans(y){
const xs=[];
for(const [[x1,y1],[x2,y2]] of edges){
if((y1<=y&&y<y2)||(y2<=y&&y<y1))
xs.push(x1+(y-y1)*(x2-x1)/(y2-y1));
}
xs.sort((a,b)=>a-b);
const out=[];
for(let i=0;i+1<xs.length;i+=2)out.push([xs[i],xs[i+1]]);
return out;
}
function intersect(A,B){
const out=[];
for(const a of A)for(const b of B){
const lo=Math.max(a[0],b[0]),hi=Math.min(a[1],b[1]);
if(hi-lo>14)out.push([lo,hi]);
}
return out;
}
function font(size){return `bold ${size}px Arial,sans-serif`}

function build(){
seed=11;
let order=PHRASES.slice(),pi=0;
for(let i=order.length-1;i>0;i--){
const j=Math.floor(rand()*(i+1));
[order[i],order[j]]=[order[j],order[i]];
}
const nextPhrase=()=>{
if(pi>=order.length){
order=PHRASES.slice();
for(let i=order.length-1;i>0;i--){
const j=Math.floor(rand()*(i+1));
[order[i],order[j]]=[order[j],order[i]];
}
pi=0;
}
return order[pi++];
};
const rowH=Math.max(...SIZES.map(z=>z*1.18))+4,half=rowH/2;
const placed=[];
for(let y=YMAX-half;y>YMIN+half;y-=rowH){
const row=intersect(spans(y+half),spans(y-half));
for(let [lo,hi] of row){
lo+=4;hi-=4;
let cur=lo+rand()*8;
const line=[];
while(true){
let fit=null;
for(let n=0;n<10;n++){
const text=nextPhrase(),size=choice(SIZES);
ctx.font=font(size);
const w=ctx.measureText(text).width;
if(cur+w<=hi){fit={text,size,w};break}
}
if(!fit)break;
line.push({x:cur+fit.w/2,y,text:fit.text,size:fit.size,w:fit.w});
cur+=fit.w+GAP;
}
if(!line.length)continue;
if(line.length>1){
const left=hi-(line[line.length-1].x+line[line.length-1].w/2);
line.forEach((it,i)=>it.x+=left*i/(line.length-1));
}else line[0].x=(lo+hi)/2;
line.forEach((it,i)=>placed.push({...it,edge:i===0||i===line.length-1}));
}
}
const wine=[.58,0,.09],crimson=[.90,.05,.14],blood=[.98,.10,.16];
placed.forEach(p=>{
const rad=Math.min(1,Math.hypot(p.x/(16*SC),(p.y-CY)/(14.5*SC)));
let base=mix(wine,crimson,.25+.75*rad);
base=mix(base,blood,rand()*.35+(p.edge?.3:0));
p.color=base.map(v=>Math.min(1,v));p.rad=rad;
});
const edgeItems=placed.filter(p=>p.edge).sort((a,b)=>Math.atan2(a.x,a.y-CY)-Math.atan2(b.x,b.y-CY));
const inner=placed.filter(p=>!p.edge).sort((a,b)=>(-a.rad+rand()*.08)-(-b.rad+rand()*.08));
return edgeItems.concat(inner);
}

let items=[],active=[],started=false,frame=0,startTime=0,shimmerTimer=0;
const BGC=[6/255,2/255,8/255],FLASH=[1,.78,.78];

function drawText(p,x,y,color,shadow=false) {
  ctx.font=font(p.size);
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  const canvasX=x+400;
  const canvasY=y+400;

  if(shadow){
    ctx.fillStyle=BG;
    ctx.fillText(p.text,canvasX+2,canvasY+3);
  }

  ctx.fillStyle=color;
  ctx.fillText(p.text,canvasX,canvasY);
}

function paint(now){
ctx.clearRect(0,0,800,800);
const elapsed=now-startTime;
const count=Math.min(items.length,Math.floor(elapsed/(DURATION/Math.max(1,items.length))));
while(frame<count){
const p=items[frame++];
p.f=0;p.dx=rand()*20-10;
active.push(p);
}
const keep=[];
for(const p of active){
p.f++;
const u=Math.min(1,p.f/ANIM),e=1-Math.pow(1-u,3);
const x=p.x,y=-p.y,px=x+p.dx*(1-e),py=y-(1-e)*LIFT,c=p.color;
drawText(p,px,py,hex(mix(BGC,c.map(v=>v*.2),e*e)));
ctx.globalCompositeOperation='destination-over';
drawText(p,px+2,py+3,hex(mix(BGC,c.map(v=>v*.30),e)));
ctx.globalCompositeOperation='source-over';
if(u<1)keep.push(p);
else drawText(p,x,y,hex(c));
}
active=keep;
if(frame>=items.length&&active.length===0){
items.forEach(p=>drawText(p,p.x,-p.y,hex(p.color)));
if(now-shimmerTimer>140){
shimmerTimer=now;
const p=choice(items);
p.flashUntil=now+260;
}
const p=items.find(q=>q.flashUntil>now);
if(p)drawText(p,p.x,-p.y,hex(mix(p.color,FLASH,.6)));
}
if(started)requestAnimationFrame(paint);
}

function fitCanvas(){
const dpr=Math.min(window.devicePixelRatio||1,2);
const rect=canvas.getBoundingClientRect();
canvas.width=Math.round(rect.width*dpr);
canvas.height=Math.round(rect.height*dpr);
ctx.setTransform(canvas.width/800,0,0,canvas.height/800,0,0);
}
window.addEventListener('resize',fitCanvas);
fitCanvas();

function preview(){
ctx.clearRect(0,0,800,800);
ctx.fillStyle='#3b0b1b';
ctx.font='bold 22px Arial';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText('A little love, in every language',400,400);
}
preview();

start.addEventListener('click',async()=>{
if(started)return;
try{await audio.play()}
catch(e){
hint.textContent='Please tap again to allow music, or check your phone volume.';
return;
}
started=true;
start.hidden=true;
hint.textContent='❤️';
items=build();
active=[];
frame=0;
startTime=performance.now();
requestAnimationFrame(paint);
});
})();
</script>
</body>
</html>
